<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>SSRSM Accounts</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Sora:wght@600;800&display=swap">
  <style>
    :root {
      --bg: #EEF2F5;
      --card: #fff;
      --ink: #14243A;
      --mut: #5F6F82;
      --line: #D5DDE5;
      --pri: #1F4E79;
      --onpri: #fff;
      --acc: #B7791F;
      --ok: #0E7C66;
      --bad: #C0392B;
      --tint: #E3EDF6;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F1822;
        --card: #172433;
        --ink: #E6EDF4;
        --mut: #93A4B8;
        --line: #2B3C50;
        --pri: #6FA8DC;
        --onpri: #0F1822;
        --acc: #E6B450;
        --ok: #3FC1A5;
        --bad: #F0776A;
        --tint: #1E3248;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #0F1822;
      --card: #172433;
      --ink: #E6EDF4;
      --mut: #93A4B8;
      --line: #2B3C50;
      --pri: #6FA8DC;
      --onpri: #0F1822;
      --acc: #E6B450;
      --ok: #3FC1A5;
      --bad: #F0776A;
      --tint: #1E3248;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 Mukta, system-ui, sans-serif;
      display: flex;
      flex-direction: column
    }

    #app {
      flex: 1;
      display: flex;
      flex-direction: column-reverse;
      min-height: 0
    }

    #main {
      flex: 1;
      overflow: auto;
      padding: 14px;
      max-width: 980px;
      width: 100%;
      margin: 0 auto
    }

    h1 {
      font-size: 22px;
      margin: 4px 0 12px;
      font-weight: 800
    }

    h2 {
      font-size: 17px;
      margin: 18px 0 8px;
      font-weight: 600
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px
    }

    .grid {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr
    }

    @media(min-width:768px) {
      .grid {
        grid-template-columns: repeat(4, 1fr)
      }

      .g2 {
        grid-template-columns: 1fr 1fr
      }
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px
    }

    .stat b {
      display: block;
      font-size: 22px;
      font-weight: 800
    }

    .stat span {
      color: var(--mut);
      font-size: 14px
    }

    .big {
      background: var(--pri);
      color: var(--onpri);
      border-color: var(--pri)
    }

    .big span {
      color: inherit;
      opacity: .85
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--mut);
      margin: 10px 0 4px
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
      color: inherit
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg)
    }

    button {
      min-height: 48px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      cursor: pointer;
      font-weight: 600
    }

    button.p {
      background: var(--pri);
      color: var(--onpri);
      border-color: var(--pri)
    }

    button.s {
      min-height: 38px;
      padding: 4px 12px;
      font-size: 14px
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 1px
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: flex-end
    }

    .row>* {
      flex: 1
    }

    .row>.x {
      flex: 0 0 48px;
      padding: 0
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px
    }

    th,
    td {
      padding: 8px 6px;
      text-align: right;
      border-bottom: 1px solid var(--line)
    }

    th:first-child,
    td:first-child {
      text-align: left
    }

    th {
      color: var(--mut);
      font-weight: 600;
      font-size: 13px
    }

    .wrap {
      overflow-x: auto
    }

    .tag {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 99px;
      font-size: 13px;
      background: var(--tint)
    }

    .ok {
      color: var(--ok)
    }

    .bad {
      color: var(--bad)
    }

    .acc {
      color: var(--acc)
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px
    }

    .chips button {
      white-space: nowrap;
      min-height: 40px
    }

    .chips .on {
      background: var(--pri);
      color: var(--onpri);
      border-color: var(--pri)
    }

    .li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      align-items: center
    }

    .li:last-child {
      border: 0
    }

    .li small {
      color: var(--mut);
      display: block
    }

    nav {
      display: flex;
      background: var(--card);
      border-top: 1px solid var(--line)
    }

    nav button {
      flex: 1;
      border: 0;
      border-radius: 0;
      background: none;
      color: var(--mut);
      min-height: 58px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0
    }

    nav button b {
      font-size: 20px;
      line-height: 1
    }

    nav .on {
      color: var(--pri);
      background: var(--tint)
    }

    .bar {
      height: 10px;
      border-radius: 5px;
      background: var(--tint);
      margin-top: 4px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--pri)
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 10px;
      display: none;
      z-index: 9;
      max-width: 90%
    }

    #login {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    #login .card {
      width: 100%;
      max-width: 380px
    }

    .hint {
      color: var(--mut);
      font-size: 13px;
      margin-top: 10px
    }

    :root {
      --bg: #F3F5FB;
      --card: #fff;
      --ink: #14173A;
      --mut: #69708F;
      --line: #E3E6F2;
      --pri: #4338CA;
      --onpri: #fff;
      --acc: #D97706;
      --ok: #059669;
      --bad: #DC2626;
      --tint: #EEF0FF
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0B1020;
        --card: #151B30;
        --ink: #EEF1FA;
        --mut: #9AA4C0;
        --line: #273050;
        --pri: #818CF8;
        --onpri: #0B1020;
        --acc: #FBBF24;
        --ok: #34D399;
        --bad: #F87171;
        --tint: #1E2647
      }
    }

    h1,
    .stat b {
      font-family: Sora, Mukta, system-ui, sans-serif;
      letter-spacing: -.02em
    }

    h1 {
      font-size: 24px
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px
    }

    .top small {
      color: var(--mut)
    }

    .top h1 {
      margin: 0
    }

    .lo {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px 14px;
      color: var(--bad);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(20, 23, 58, .06), 0 6px 16px rgba(20, 23, 58, .08)
    }

    .lo svg {
      width: 20px;
      height: 20px
    }

    #fcl {
      opacity: .5;
      background: var(--tint);
      color: var(--mut);
      cursor: not-allowed;
      pointer-events: none;
      user-select: none
    }

    .ca {
      margin-top: 4px
    }

    #pv {
      position: fixed;
      inset: 0;
      z-index: 15;
      background: var(--bg);
      display: flex;
      flex-direction: column
    }

    #pv .pvt {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      background: var(--card);
      box-shadow: 0 2px 10px rgba(20, 23, 58, .12)
    }

    #pv .pvt b {
      flex: 1;
      font-family: Sora, Mukta, sans-serif
    }

    #pv .pvb {
      flex: 1;
      overflow: auto;
      padding: 12px
    }

    #pv .paper {
      background: #fff;
      color: #000;
      border-radius: 6px;
      padding: 16px;
      min-width: max-content;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .25)
    }

    #pv .paper h3 {
      text-align: center;
      margin: 0;
      font: 800 18px Sora, Mukta, sans-serif
    }

    #pv .paper p {
      text-align: center;
      margin: 4px 0 12px;
      color: #444;
      font-size: 14px
    }

    #pv .paper table {
      min-width: 900px;
      border-collapse: collapse
    }

    #pv .paper th,
    #pv .paper td {
      border: 1.2px solid #1F2F8F;
      padding: 7px 8px;
      text-align: right;
      background: #fff;
      color: #000
    }

    #pv .paper th {
      text-align: center;
      font-size: 12px;
      line-height: 1.25
    }

    #pv .paper td:nth-child(-n+2) {
      text-align: center
    }

    #pv .paper td.nt {
      text-align: left;
      min-width: 140px
    }

    #pv .paper tfoot td {
      font-weight: 800
    }

    @media print {
      #pv {
        display: none !important
      }
    }

    .card,
    .stat {
      border: 0;
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(20, 23, 58, .06), 0 8px 22px rgba(20, 23, 58, .07)
    }

    .stat b {
      font-size: 21px;
      margin-top: 2px
    }

    .big,
    .hero {
      background: linear-gradient(135deg, #312E81, #4F46E5 55%, #06B6D4);
      color: #fff
    }

    .hero {
      grid-column: 1/-1;
      padding: 20px
    }

    .hero b {
      font-size: 34px;
      color: #fff
    }

    .hero span {
      color: #fff;
      opacity: .85
    }

    .md {
      border-top: 4px solid var(--pri)
    }

    .md.Cash {
      border-color: #059669
    }

    .md.RTGS {
      border-color: #4F46E5
    }

    .md.Cheque {
      border-color: #D97706
    }

    .md.Auto {
      border-color: #06B6D4
    }

    input,
    select,
    textarea {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 14px
    }

    input:focus,
    select:focus {
      border-color: var(--pri)
    }

    button {
      border-radius: 14px
    }

    button.p {
      background: linear-gradient(135deg, #4338CA, #4F46E5);
      color: #fff;
      border: 0;
      box-shadow: 0 6px 14px rgba(79, 70, 229, .35)
    }

    th {
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: 12px
    }

    nav {
      margin: 0 12px 10px;
      border: 0;
      border-radius: 24px;
      padding: 6px;
      gap: 4px;
      box-shadow: 0 10px 30px rgba(20, 23, 58, .22)
    }

    nav button {
      border-radius: 18px;
      min-height: 58px
    }

    nav .on {
      background: var(--tint);
      color: var(--pri)
    }

    nav svg {
      width: 24px;
      height: 24px
    }

    #login {
      background: linear-gradient(160deg, #312E81, #4F46E5 60%, #06B6D4)
    }

    #login .card {
      padding: 26px
    }

    #login h1 {
      margin-top: 0
    }

    .ph {
      display: flex;
      gap: 14px;
      align-items: center;
      color: #fff;
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 8px 22px rgba(20, 23, 58, .18)
    }

    .ph i {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .2);
      display: grid;
      place-items: center;
      flex: none
    }

    .ph svg {
      width: 24px;
      height: 24px
    }

    .ph b {
      display: block;
      font: 800 20px Sora, Mukta, sans-serif
    }

    .ph small {
      opacity: .9
    }

    .ph~h1 {
      display: none
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px
    }

    h2:before {
      content: "";
      width: 4px;
      height: 18px;
      border-radius: 2px;
      background: var(--pri)
    }

    label {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .02em
    }

    .ln {
      background: var(--tint);
      padding: 10px;
      border-radius: 14px;
      margin-bottom: 8px
    }

    tr:nth-child(even) td {
      background: rgba(99, 102, 241, .06)
    }

    td b {
      color: var(--pri)
    }

    .tile {
      color: #fff;
      border: 0;
      min-height: 120px;
      border-radius: 20px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(20, 23, 58, .2)
    }

    .tile svg {
      width: 28px;
      height: 28px;
      margin-bottom: auto
    }

    .tile b {
      font-size: 17px
    }

    .tile small {
      opacity: .85;
      font-weight: 400
    }

    .who {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .who em {
      font-style: normal
    }

    .ini {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--tint);
      color: var(--pri);
      display: grid;
      place-items: center;
      font-style: normal;
      font-weight: 800;
      flex: none
    }

    #main>* {
      animation: up .35s both
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(8px)
      }
    }

    .chart {
      display: flex;
      gap: 10px;
      height: 190px;
      margin: 8px 0 14px
    }

    .cb {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      font-size: 12px;
      min-width: 0
    }

    .cb>b {
      font-size: 12px;
      margin-bottom: 4px
    }

    .bw {
      flex: 1;
      display: flex;
      align-items: flex-end;
      width: 100%
    }

    .bw i {
      width: 100%;
      border-radius: 8px 8px 0 0;
      min-height: 4px
    }

    .cb>span {
      margin-top: 6px;
      color: var(--mut);
      line-height: 1.2
    }

    .regt {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse
    }

    .regt th,
    .regt td {
      border: 1.5px solid var(--pri);
      padding: 9px 8px;
      text-align: right
    }

    .regt th {
      text-align: center;
      font-size: 13px;
      line-height: 1.25;
      background: var(--tint)
    }

    .regt td:nth-child(-n+2) {
      text-align: center
    }

    .regt .nt {
      text-align: left;
      min-width: 150px
    }

    .rg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 12px
    }

    .rd {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      margin: 0;
      color: var(--ink);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0
    }

    .rd input {
      width: 26px;
      height: 26px;
      min-height: 0;
      padding: 0;
      flex: none;
      accent-color: var(--pri)
    }

    @page {
      size: A4 landscape;
      margin: 12mm
    }

    #rg table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse
    }

    #rg th,
    #rg td {
      border: 1.5px solid var(--pri);
      padding: 9px 8px;
      text-align: right
    }

    #rg th {
      text-align: center;
      font-size: 13px;
      line-height: 1.25;
      background: var(--tint)
    }

    #rg td:nth-child(-n+2) {
      text-align: center
    }

    #rg tfoot td {
      font-weight: 800;
      background: var(--tint)
    }

    .rgt {
      text-align: center;
      font-weight: 800;
      font-size: 18px
    }

    .rgs {
      text-align: center;
      color: var(--mut);
      font-size: 14px;
      margin-bottom: 10px
    }

    @media print {
      .ph {
        display: none !important
      }

      #rb {
        display: none
      }

      #rg .card {
        box-shadow: none;
        border: 0;
        padding: 0;
        background: #fff
      }

      #rg h2 {
        display: none
      }

      #rg .wrap {
        overflow: visible
      }

      #rg table {
        min-width: 0;
        font-size: 12.5px;
        color: #000
      }

      #rg th,
      #rg td {
        padding: 10px 6px;
        border-color: #1F2F8F;
        color: #000
      }

      #rg th,
      #rg tfoot td {
        background: #fff
      }

      .rgt,
      .rgs {
        color: #000
      }
    }

    @media print {

      nav,
      .noprint,
      #toast {
        display: none !important
      }

      body {
        background: #fff;
        color: #000;
        display: block
      }

      #main {
        overflow: visible
      }

      .card,
      .stat {
        border-color: #999;
        background: #fff;
        color: #000
      }
    }

    .regt tfoot td {
      font-weight: 800;
      background: var(--tint)
    }

    .regt td.sm,
    #pv .paper td.sm {
      text-align: left;
      min-width: 100px
    }

    .regt tr.grp td {
      background: rgba(217, 119, 6, .14)
    }

    #pv .paper tr.grp td {
      background: #FFF6DD
    }

    @media print {
      .regt tr.grp td {
        background: #FFF6DD !important
      }
    }

    .po {
      display: none;
      text-align: right;
      color: #69708F;
      font-size: 12px;
      margin-top: 8px
    }

    @media print {

      html,
      body {
        height: auto !important
      }

      #app {
        display: block !important;
        height: auto !important
      }

      #main {
        max-width: none !important;
        padding: 0 !important;
        overflow: visible !important
      }

      .po {
        display: block !important;
        color: #000
      }

      .regt thead {
        display: table-header-group
      }

      .regt tr {
        page-break-inside: avoid
      }
    }

    @media print {
      .regt {
        min-width: 0;
        font-size: 11px;
        color: #000
      }

      .regt th,
      .regt td {
        padding: 6px 4px;
        border-color: #1F2F8F;
        color: #000;
        background: #fff !important
      }

      .wrap {
        overflow: visible
      }

      .rgt,
      .rgs {
        color: #000
      }
    }
  </style>
  <div id="login">
    <div class="card">
      <h1>SSRSM Accounts</h1>
      <label>Username</label><input id="lu" value="admin" autocomplete="username">
      <label>Password</label><input id="lp" type="password" placeholder="admin123" autocomplete="current-password">
      <div style="height:14px"></div><button class="p" style="width:100%" onclick="login()">Log in</button>
    </div>
  </div>
  <div id="app">
    <nav id="nav"></nav>
    <div id="main"></div>
  </div>
  <div id="toast"></div>
  <script>
    const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
    const K = 'ssrsm_demo_v1', MODES = ['Cash', 'RTGS', 'Cheque', 'Auto', 'Credit'];
    const td = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const yd = () => { const d = new Date(); d.setDate(d.getDate() - 1); return td(d) };
    const inr = n => '₹' + (Math.round(n * 100) / 100).toLocaleString('en-IN');
    const escH = s => String(s).replace(/[&<>"]/g, h => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[h]));
    const uid = () => Math.random().toString(36).slice(2, 9);
    const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
    function seed() {
      const T = td(), Y = T; return {
        cats: ['Dettol', 'Dabur', 'Diapers'],
        prods: [{ id: 'p1', n: 'Dettol', c: 'Dettol', s: 145, d: 2 }, { id: 'p2', n: 'Dabur', c: 'Dabur', s: 110, d: 0 }, { id: 'p3', n: 'Diapers', c: 'Diapers', s: 80, d: 0 }],
        custs: [{ id: 'c1', n: 'Sharma General Store', ph: '98200 11111' }, { id: 'c2', n: 'Gupta Medical', ph: '98200 22222' }, { id: 'c3', n: 'Raj Kirana', ph: '98200 33333' }, { id: 'c4', n: 'City Mart', ph: '98200 44444' }],
        sales: [{ id: 's1', d: Y, c: 'c1', items: [{ p: 'p1', q: 10, a: 6000 }, { p: 'p2', q: 10, a: 14000 }], t: 20000, note: '' }, { id: 's2', d: T, c: 'c2', items: [{ p: 'p1', q: 5, a: 8500 }], t: 8500, note: '' }, { id: 's3', d: T, c: 'c3', items: [{ p: 'p3', q: 6, a: 12000 }], t: 12000, note: 'Bulk order' }],
        pays: [{ id: 'y1', d: Y, c: 'c1', m: 'Cash', a: 15000, st: 'Cleared' }, { id: 'y2', d: T, c: 'c2', m: 'RTGS', a: 5000, st: 'Cleared' }, { id: 'y3', d: T, c: 'c3', m: 'Auto', a: 4000, st: 'Cleared' }, { id: 'y4', d: T, c: 'c1', m: 'Cheque', a: 3000, st: 'Pending' }],
        rets: [{ id: 'r1', d: T, c: 'c2', p: 'p1', q: 2, t: 'Damaged' }, { id: 'r2', d: T, c: 'c3', p: 'p3', q: 1, t: 'Sellable' }],
        adj: [], closings: [], reg: [], sm: []
      }
    }
    let S = seed();
    const save = () => { };
    const prod = n => S.prods.find(p => p.n.toLowerCase() === String(n).trim().toLowerCase());
    const pid = i => S.prods.find(p => p.id === i) || { n: '(deleted)', s: 0, d: 0, c: '' };
    const cust = n => S.custs.find(c => c.n.toLowerCase() === String(n).trim().toLowerCase());
    const cid = i => S.custs.find(c => c.id === i);
    const live = x => x.st !== 'Bounced';
    const bal = () => sum(S.sales, s => s.t) - sum(S.pays.filter(live), p => p.a);
    function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600) }
    function logout() { $('#lp').value = ''; $('#login').style.display = 'flex'; tab = 'home'; sub = ''; render() }
    function login() { if ($('#lu').value === 'admin' && $('#lp').value === 'admin123') { $('#login').style.display = 'none' } else toast('Wrong username or password') }
    const IC = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
    const TABS = [['home', IC('M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z'), 'Home'], ['sale', IC('M12 5v14M5 12h14'), 'Stock'], ['stock', IC('M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M7 14h10v7H7z'), 'Print / PDF'], ['sm', IC('M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75'), 'Sales man']];
    let tab = 'home', sub = '';
    function go(t, s = '') { tab = t; sub = s; render(); $('#main').scrollTop = 0 }
    const BN = { sale: ['New stock', '', '#4338CA,#6366F1', ''], pay: ['Collect payment', 'Cash, RTGS, cheque or auto', '#047857,#10B981', 'M6 5h12M6 10h12M9 5c5 0 5 7 0 7H6l8 8'], stock: ['Print / PDF', '', '#B45309,#F59E0B', ''], sm: ['Sales man', '', '#0E7490,#06B6D4', ''], more: ['More', 'Customers, products, reports, closing', '#6D28D9,#A855F7', 'M4 7h16M4 12h16M4 17h16'] };
    const SUBT = { cust: 'Customers', prods: 'Products', rep: 'Reports & PDF', close: 'Daily closing' };
    function banner() { const b = BN[tab], s = tab === 'more' && sub; return `<div class="ph" style="background:linear-gradient(135deg,${b[2]})">${b[3] ? `<i>${IC(b[3])}</i>` : ''}<div><b>${s ? SUBT[sub] : b[0]}</b><small>${s ? '' : b[1]}</small></div></div>` }
    const dl = () => `<datalist id="cl">${S.custs.map(c => `<option value="${c.n}">`).join('')}</datalist><datalist id="pl">${S.prods.map(p => `<option value="${p.n}">`).join('')}</datalist>`;
    const modeSel = id => `<select id="${id}">${MODES.map(m => `<option>${m}</option>`).join('')}</select>`;
    function render() {
      $('#nav').innerHTML = TABS.map(([k, i, n]) => `<button class="${tab === k ? 'on' : ''}" onclick="go('${k}')"><b>${i}</b>${n}</button>`).join('');
      const v = { home, sale, pay, stock, sm, more }[tab]; $('#main').innerHTML = dl() + (tab === 'home' ? '' : banner()) + v(); if (tab === 'sale') autoO(1); if (tab === 'rep') rep();
    }
    function colls(day) { const P = S.pays.filter(p => p.d === day && live(p)); return { all: sum(P, p => p.a), by: Object.fromEntries(MODES.map(m => [m, sum(P.filter(p => p.m === m), p => p.a)])) } }
    let hp = 'Today', h1 = td(), h2 = td(), hpP = 'All';
    function hrange() {
      const T = td(), d = new Date(), y = d.getFullYear(), m = d.getMonth(), k = (d.getDay() + 6) % 7;
      if (hp === 'Today') return [T, T];
      if (hp === 'Week') return [td(new Date(y, m, d.getDate() - k)), td(new Date(y, m, d.getDate() - k + 6))];
      if (hp === '1 Month') return [td(new Date(y, m, 1)), td(new Date(y, m + 1, 0))];
      if (hp === '1 Year') return [y + '-01-01', y + '-12-31'];
      return [h1, h2]
    }
    function homeChart() {
      const [f, t] = hrange(), sa = d => sum(S.sales.filter(s => s.d === d), s => s.t),
        rate = p => { const l = S.sales.flatMap(s => s.items.filter(i => i.p === p)), q = sum(l, i => i.q); return q ? sum(l, i => i.a) / q : 0 },
        rtd = d => Math.round(sum(S.rets.filter(r => r.d === d && r.t === 'Sellable'), r => r.q * rate(r.p))),
        T5 = (() => { const a = [0, 0, 0, 0, 0]; (hpP === 'All' ? [...new Set(S.reg.map(x => x.p).filter(Boolean))] : [hpP]).forEach(pn => { const RR = regRows(pn), W = RR.filter(x => x.d >= f && x.d <= t && !x.ex), pre = RR.filter(x => x.d < f), po = W.length ? W[0].o : (pre.length ? pre[pre.length - 1].cl : OPEN0), pq = sum(W, x => x.ns), ps = sum(W, x => x.sa), pr = sum(W, x => x.rt); a[0] += po; a[1] += pq; a[2] += ps; a[3] += pr; a[4] += W.length ? W[W.length - 1].cl : po }); return a })(),
        o = T5[0], ns = T5[1], s = T5[2], rt = T5[3], cl = T5[4], mx = Math.max(o, ns, s, rt, cl, 1);
      return `<div class="card"><div class="chips">${['Today', 'Week', '1 Month', '1 Year', 'Custom'].map(k => `<button class="${hp === k ? 'on' : ''}" onclick="hp='${k}';render()">${k}</button>`).join('')}</div>${hp === 'Custom' ? `<div class="row"><div><label>From</label><input type="date" value="${h1}" onchange="h1=this.value;render()"></div><div><label>To</label><input type="date" value="${h2}" onchange="h2=this.value;render()"></div></div>` : ''}<div class="rg" style="margin-top:6px">${['All', 'Dettol', 'Dabur', 'Diaper'].map(m => `<label class="rd"><input type="radio" name="hpp" value="${m}" ${hpP === m ? 'checked' : ''} onchange="hpP='${m}';render()">${m}</label>`).join('')}</div><h2 style="margin-top:12px">Stock chart · ${hpP}</h2><p class="hint" style="margin:0">${f.split('-').reverse().join('/')}${f !== t ? ' to ' + t.split('-').reverse().join('/') : ''}</p><div class="chart">${[['Opening stock', o, 'var(--pri)'], ['New stock', ns, '#06B6D4'], ['Daily sales', s, 'var(--acc)'], ['Return stock', rt, 'var(--ok)'], ['Total closing stock', cl, 'var(--ink)']].map(([n, v, k]) => `<div class="cb"><b>${inr(v)}</b><div class="bw"><i style="height:${Math.max(2, v / mx * 100)}%;background:${k}"></i></div><span>${n}</span></div>`).join('')}</div></div>`
    }
    function home() {
      const T = td(), c = collsR(), ts = sum(S.sales.filter(s => s.d === T), s => s.t), tot = sum(S.prods, p => p.s), out = sum(S.custs, x => Math.max(0, bal(x.id)));
      const pend = S.custs.filter(x => bal(x.id) > 0).sort((a, b) => bal(b.id) - bal(a.id));
      return `<div class="top"><div><small>${new Date().toDateString()}</small><h1>SSRSM Accounts</h1></div><button class="lo" onclick="logout()" aria-label="Logout">${IC('M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9')}Logout</button></div><div class="grid">
<div style="grid-column:1/-1">${homeChart()}</div></div>
<h2>Collection by mode · ${hp}</h2><div class="grid">${MODES.map(m => `<div class="stat md ${m}"><span>${m === 'Auto' ? 'Auto collection' : m}</span><b>${inr(c.by[m])}</b></div>`).join('')}</div>${smBox()}`
    }
    function smBox() {
      const by = collsSm(), L = S.sm.filter(x => hpP === 'All' || x.p === hpP).map(x => ({ n: x.n, p: x.p, k: x.n + '|' + x.p })), ks = L.map(o => o.k);
      Object.keys(by).filter(k => !ks.includes(k) && (by[k] || k.split('|')[0])).forEach(k => { const a = k.split('|'); L.push({ n: a[0] || 'Unassigned', p: a[1], k }) });
      return `<h2>Collection by sales man · ${hp}</h2>` + (L.length ? `<div class="grid">${L.map(o => `<div class="stat md Auto"><span>${escH(o.n)}${o.p ? ' <small>(' + escH(o.p) + ')</small>' : ''}</span><b>${inr(by[o.k] || 0)}</b></div>`).join('')}</div>` : '<div class="card"><p class="hint" style="margin:0">Sales man tab me naam jodo, phir yaha collection dikhega.</p></div>')
    }
    function sale() {
      const f = (l, id, m = 'decimal', ph = '') => `<label>${l}</label><input id="${id}" type="text" inputmode="${m}" autocomplete="off" placeholder="${ph}" oninput="calc()">`;
      return `<div class="card"><label>Product</label><div class="rg">${['Dettol', 'Dabur', 'Diaper'].map(m => `<label class="rd"><input type="radio" name="pr" value="${m}" onchange="autoO(1);fillSm()">${m}</label>`).join('')}</div><label>Date</label><input id="fd" type="date" onclick="try{this.showPicker()}catch(e){}" onchange="autoO()"><p id="exh" class="hint" hidden style="margin:6px 0 0"></p><label>Opening Stock</label><input id="fo" type="text" inputmode="decimal" autocomplete="off" placeholder="Auto: previous closing stock" oninput="manO()">${f('Daily Sales', 'fs')}${f('Return Stock', 'fr')}${f('New Stock', 'fnw')}<label>Total Closing Stock (automatic)</label><input id="fcl" readonly>
<h2>Collection</h2><p class="hint" style="margin:0">Tick one or more modes, then enter the amount for each.</p><div class="rg">${['Cash', 'Cheque', 'RTGS', 'Auto', 'Credit'].map(m => `<label class="rd"><input type="checkbox" name="cm" value="${m}" onchange="togCm('${m}',this.checked)">${m}</label>`).join('')}</div>${['Cash', 'Cheque', 'RTGS', 'Auto', 'Credit'].map(m => `<div class="ca" id="ca_${m}" hidden><label>${m} amount</label><input id="fc_${m}" type="text" inputmode="decimal" autocomplete="off" placeholder="₹ ${m}"></div>`).join('')}<label>Sales man</label><select id="fsm"><option value="">Select product first</option></select><label>Note (optional)</label><textarea id="fnote" rows="4" style="min-height:120px;font:inherit;resize:vertical"></textarea>
<div style="height:14px"></div><button class="p" style="width:100%" onclick="saveReg()">Save entry</button></div>`}
    let smP = 'Dettol', smEd = null, smDel = null;
    function sm() {
      const L = S.sm.map((x, i) => ({ x, i })).filter(o => o.x.p === smP);
      const row = o => smEd === o.i ? `<div class="li" style="display:block"><label>Edit sales man name</label><input id="smen" value="${escH(o.x.n)}" autocomplete="off"><div class="row" style="margin-top:10px"><button onclick="smEd=null;render()">Cancel</button><button class="p" onclick="saveSm(${o.i})">Save name</button></div></div>` : `<div class="li"><span class="who"><i class="ini">${escH(o.x.n[0] || '?').toUpperCase()}</i><em>${escH(o.x.n)}<small>${o.x.p}</small></em></span><span style="display:flex;gap:8px"><button class="s" onclick="editSm(${o.i})">Edit</button>${smDel === o.i ? `<button class="s" style="color:var(--bad)" onclick="delSm(${o.i})">Confirm delete</button><button class="s" onclick="smDel=null;render()">Cancel</button>` : `<button class="s" onclick="askSmDel(${o.i})">Delete</button>`}</span></div>`;
      return `<div class="card"><label>Product</label><div class="rg">${['Dettol', 'Dabur', 'Diaper'].map(m => `<label class="rd"><input type="radio" name="smp" value="${m}" ${smP === m ? 'checked' : ''} onchange="smP='${m}';smEd=null;smDel=null;render()">${m}</label>`).join('')}</div><label>New ${smP} sales man name</label><input id="smn" placeholder="e.g. Ramesh" autocomplete="off"><div style="height:12px"></div><button class="p" style="width:100%" onclick="addSm()">Add sales man to ${smP}</button></div><h2>${smP} sales man</h2><div class="card">${L.map(row).join('') || `<p class="hint" style="margin:0">${smP} me abhi koi sales man nahi hai.</p>`}</div>`
    }
    function addSm() { const n = $('#smn').value.trim(); if (!n) return toast('Enter sales man name'); if (S.sm.some(x => x.p === smP && x.n.toLowerCase() === n.toLowerCase())) return toast('This sales man already exists in ' + smP); S.sm.push({ n, p: smP }); save(); toast('Sales man added to ' + smP); render() }
    function editSm(i) { smEd = i; smDel = null; render(); const el = $('#smen'); if (el) { el.focus(); el.select() } }
    function saveSm(i) { const x = S.sm[i], n = $('#smen').value.trim(); if (!n) return toast('Enter sales man name'); if (S.sm.some((y, k) => k !== i && y.p === x.p && y.n.toLowerCase() === n.toLowerCase())) return toast('This sales man already exists in ' + x.p); const old = x.n; x.n = n; S.reg.forEach(e => { if (e.sm === old && e.p === x.p) e.sm = n }); smEd = null; save(); toast('Name updated'); render() }
    function askSmDel(i) { smDel = i; smEd = null; render() }
    function delSm(i) { S.sm.splice(i, 1); smDel = null; smEd = null; save(); toast('Sales man deleted'); render() }
    function fillSm() { const sel = $('#fsm'); if (!sel) return; const pr = document.querySelector('input[name=pr]:checked'); sel.innerHTML = '<option value="">' + (pr ? 'Select sales man' : 'Select product first') + '</option>' + (pr ? S.sm.filter(x => x.p === pr.value).map(x => '<option>' + escH(x.n) + '</option>').join('') : '') }
    function addLine() { const d = document.createElement('div'); d.className = 'row ln'; d.innerHTML = `<div style="flex:2"><label>Product</label><input class="lp" list="pl" placeholder="Search product"></div><div><label>Qty</label><input class="lq" type="number" inputmode="numeric"></div><div><label>Amount ₹</label><input class="la" type="number" inputmode="decimal"></div><button class="x" onclick="this.parentNode.remove();tot()">✕</button>`; d.oninput = tot; $('#lines').appendChild(d) }
    function tot() { $('#st').value = inr(sum($$('.la'), i => +i.value || 0)) }
    function saveSale() {
      const c = S.custs[0];
      const items = []; for (const r of $$('.ln')) { const p = prod(r.querySelector('.lp').value), q = +r.querySelector('.lq').value, a = +r.querySelector('.la').value; if (!p || !(q > 0) || !(a > 0)) return toast('Check every item row'); items.push({ p: p.id, q, a }) }
      if (!items.length) return toast('Add at least one item');
      const need = {}; items.forEach(i => need[i.p] = (need[i.p] || 0) + i.q);
      for (const k in need) if (need[k] > pid(k).s) return toast('Only ' + pid(k).s + ' left of ' + pid(k).n);
      const t = sum(items, i => i.a), paid = +$('#sp').value || 0; if (paid > t) return toast('Received is more than the total');
      $('#sb').disabled = true; items.forEach(i => pid(i.p).s -= i.q);
      S.sales.push({ id: uid(), d: td(), c: c.id, items, t, note: $('#sn').value });
      if (paid > 0) { const m = $('#sm').value; S.pays.push({ id: uid(), d: td(), c: c.id, m, a: paid, st: m === 'Cheque' ? 'Pending' : 'Cleared' }) }
      save(); toast('Sale saved'); go('home')
    }
    function pay() {
      const T = td(), P = S.pays.filter(p => p.d === T).reverse(); return `<h1>Collect payment</h1><div class="card"><p id="ob" class="hint">Pending balance: ${inr(bal())}</p>
<label>Amount received ₹</label><input id="pa" type="number" inputmode="decimal"><label>Mode</label>${modeSel('pm')}
<div style="height:14px"></div><button class="p" style="width:100%" onclick="savePay()">Save payment</button></div>`}
    function ob() { const c = cust($('#pc').value); $('#ob').textContent = c ? 'Pending balance: ' + inr(bal(c.id)) : '' }
    function chq(i, s) { S.pays.find(p => p.id === i).st = s; save(); render(); toast('Cheque marked ' + s) }
    function savePay() {
      const c = S.custs[0], a = +$('#pa').value; if (!(a > 0)) return toast('Enter an amount');
      if (a > bal(c.id) && !confirm('This is more than the pending ' + inr(bal(c.id)) + '. Save anyway?')) return;
      const m = $('#pm').value; S.pays.push({ id: uid(), d: td(), c: c.id, m, a, st: m === 'Cheque' ? 'Pending' : 'Cleared' }); save(); toast('Payment saved'); render()
    }
    let cat = 'All';
    function stock() {
      const T = td(), L = S.prods.filter(p => cat === 'All' || p.c === cat);
      return `<h1>Stock</h1>
<div class="card wrap"><table><tr><th>Product</th><th>Open</th><th>Sold</th><th>Ret</th><th>Close</th></tr>${L.map(p => {
        const so = sum(S.sales.filter(s => s.d === T), s => sum(s.items.filter(i => i.p === p.id), i => i.q)), rt = sum(S.rets.filter(r => r.d === T && r.p === p.id && r.t === 'Sellable'), r => r.q), ad = sum(S.adj.filter(a => a.d === T && a.p === p.id), a => a.q);
        return `<tr><td>${p.n}</td><td>${p.s + so - rt - ad}</td><td>${so}</td><td>${rt}</td><td><b>${p.s}</b></td></tr>`
      }).join('')}</table></div>
<p class="hint">Close = Open − Sold + Sellable returns. Tomorrow’s opening is today’s closing automatically.</p>
<h2>Return</h2><div class="card"><label>Product</label><input id="rp" list="pl"><label>Quantity</label><input id="rq" type="number" inputmode="numeric"><div style="height:14px"></div><button class="p" style="width:100%" onclick="saveRet()">Save return</button></div>`}
    function saveRet() {
      const c = S.custs[0], p = prod($('#rp').value), q = +$('#rq').value; if (!p || !(q > 0)) return toast('Pick product and quantity');
      const t = 'Sellable'; p.s += q; S.rets.push({ id: uid(), d: td(), c: c.id, p: p.id, q, t }); save(); toast(t + ' return saved'); render()
    }
    function saveAdj() {
      const p = prod($('#ap').value), q = +$('#aq').value; if (!p || !q) return toast('Pick product and quantity');
      if (p.s + q < 0) return toast('Stock cannot go below zero'); p.s += q; S.adj.push({ id: uid(), d: td(), p: p.id, q }); save(); toast('Adjustment saved'); render()
    }
    function more() {
      if (sub) return `<button onclick="go('more')" class="noprint">← Back</button>` + { prods: prodv, rep: repv }[sub]();
      return `<h1>More</h1><div class="grid">${[].map(([k, n, d, g, p]) => `<button class="tile" style="background:linear-gradient(135deg,${g})" onclick="go('more','${k}')">${IC(p)}<b>${n}</b><small>${d}</small></button>`).join('')}</div>
<p class="hint" style="margin-top:16px">Demo data goes back to the starting values every time you reopen the app. <a href="#" onclick="if(confirm('Reset all demo data?')){S=seed();save();go('home')}return false">Reset demo data</a></p>`}
    function custv() {
      return `<h1>Customers</h1><div class="card"><div class="row"><div style="flex:2"><label>New shop name</label><input id="nn"></div><div><label>Phone</label><input id="np" inputmode="tel"></div></div><div style="height:12px"></div><button class="p" onclick="addC()">Add shop</button></div>
